name: Release

on:
  push:
    tags:
      - "v*"
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build and upload (e.g. v0.1.3-mc26.10)"
        required: true
        type: string

permissions:
  contents: write

# 同一个 tag 的 tag 推送与 Release 发布可能同时触发（例如在 UI 上新建 tag 并直接发布），
# 用并发组串行化，避免两个运行同时向同一个 Release 上传同名产物。
concurrency:
  group: release-${{ github.event.release.tag_name || github.ref_name }}
  cancel-in-progress: false

jobs:
  resolve-tag:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
      mc_line: ${{ steps.resolve.outputs.mc_line }}
    steps:
      - id: resolve
        name: Resolve release tag
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            tag="${{ github.event.release.tag_name }}"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="${{ github.event.inputs.tag }}"
          else
            tag="${GITHUB_REF_NAME}"
          fi
          if [ -z "$tag" ]; then
            echo "Unable to resolve release tag" >&2
            exit 1
          fi
          echo "Resolved release tag: $tag"

          # 版本号规则见 docs/versioning-and-release.md：
          #   v<major>.<minor>.<patch>[-rc.N]-mc<mc_major>.<mc_minor>
          # MC 版本线必须恰好是 major.minor 两段。多一段（mc1.9.0）会让 MC 线之间的
          # semver 排序依赖写法，解析时直接拒绝。
          if ! [[ "$tag" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)(-(rc|alpha|beta|dev)\.[0-9]+)?-mc([0-9]+\.[0-9]+)$ ]]; then
            echo "::error::Malformed release tag '$tag'. Expected v<major>.<minor>.<patch>[-rc.N]-mc<mc_major>.<mc_minor>, e.g. v0.1.3-mc26.10" >&2
            exit 1
          fi
          version="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}${BASH_REMATCH[4]}-mc${BASH_REMATCH[6]}"
          mc_line="${BASH_REMATCH[6]}"
          echo "Resolved version: $version (MC line: $mc_line)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "mc_line=$mc_line" >> "$GITHUB_OUTPUT"

  build:
    needs:
      - resolve-tag
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        target_type:
          - server
          - client
    steps:
      - uses: actions/checkout@v7

      # tag 必须在 tooth.json 的 version 更新之后打，否则模组内 manifest.json 显示的
      # modVersion（modpacker 从 tag 解析）会与 lipr 索引里的 version 对不上。
      - name: Verify tooth.json version matches tag
        shell: pwsh
        run: |
          $expected = "${{ needs.resolve-tag.outputs.version }}"
          $actual = (Get-Content tooth.json -Raw | ConvertFrom-Json).version
          if ($actual -ne $expected) {
            throw "tooth.json version '$actual' does not match release tag version '$expected'"
          }
          "tooth.json version $actual matches tag"

      # MC 版本线必须与 xmake.lua 里 pin 的 levilamina 版本一致，否则打出来的包
      # 适配的是另一条 MC 线（例如 26.20 的 tag 构建出 26.10 的依赖）。
      - name: Verify pinned levilamina matches MC line
        shell: pwsh
        run: |
          $mcLine = "${{ needs.resolve-tag.outputs.mc_line }}"
          $xmake = Get-Content xmake.lua -Raw
          $pins = [regex]::Matches($xmake, 'levilamina[^"'']*?\s+([0-9]+\.[0-9]+\.[0-9]+)') |
            ForEach-Object { $_.Groups[1].Value } |
            Sort-Object -Unique
          if (-not $pins) {
            throw "No levilamina version pin found in xmake.lua"
          }
          foreach ($pin in $pins) {
            $line = $pin.Substring(0, $pin.LastIndexOf('.'))
            if ($line -ne $mcLine) {
              throw "xmake.lua pins levilamina $pin (MC line $line) but the release tag targets MC line $mcLine"
            }
          }
          "levilamina pin(s) $($pins -join ', ') match MC line $mcLine"

      - uses: xmake-io/github-action-setup-xmake@v1
        # with:
        #   xmake-version: branch@master

      # 上游预编译包由其它工具链产出，和本机 clang-cl / MSVC 组合不一致时会留下
      # “已安装但缺少库文件”的损坏包（典型症状：libcurl 构建时 ninja 报 zlib.lib 缺失）。
      # 关闭预编译包，依赖统一从源码构建，保证包内文件与当前工具链一致。
      - run: |
          xmake global --policies=package.precompiled:n

      - name: Setup LLVM
        uses: ZhongRuoyu/setup-llvm@v0
        with:
          llvm-version: 22

      # 包构建中间目录按 run 隔离：不复用上次可能残留的半成品构建缓存。
      - run: |
          xmake repo -u
        env:
          XMAKE_PKG_CACHEDIR: ${{ runner.temp }}/xmake-package-cache-${{ github.run_id }}

      # 缓存键绑定包仓库 revision 与 xmake.lua，避免复用到依赖版本不匹配的旧包。
      - id: package-repositories
        shell: pwsh
        run: |
          $revisions = Get-ChildItem "$env:LOCALAPPDATA/.xmake/repositories" -Directory |
            Sort-Object Name |
            ForEach-Object {
              $revision = git -C $_.FullName rev-parse HEAD
              if ($LASTEXITCODE -ne 0) { throw "Unable to resolve $($_.Name) repository revision" }
              "$($_.Name)-$revision"
            }
          if (-not $revisions) { throw "No xmake package repositories were found" }
          "revisions=$($revisions -join '-')" >> $env:GITHUB_OUTPUT

      # 只缓存已安装的包目录。整个 .xmake 不能缓存：里面的 cache/packages 会带上失败构建的
      # 中间产物，恢复后 xmake 认为包已装好而跳过重建，构建随即在上述 zlib.lib 处失败。
      - uses: actions/cache@v6
        with:
          path: ~/AppData/Local/.xmake/packages
          key: xmake-packages-${{ runner.os }}-${{ matrix.target_type }}-${{ steps.package-repositories.outputs.revisions }}-${{ hashFiles('xmake.lua') }}
          restore-keys: |
            xmake-packages-${{ runner.os }}-${{ matrix.target_type }}-

      - run: |
          xmake f -a x64 -m release -p windows --target_type=${{ matrix.target_type }} -y
        env:
          XMAKE_PKG_CACHEDIR: ${{ runner.temp }}/xmake-package-cache-${{ github.run_id }}

      - run: |
          xmake -w -y
        env:
          XMAKE_PKG_CACHEDIR: ${{ runner.temp }}/xmake-package-cache-${{ github.run_id }}

      - uses: actions/upload-artifact@v7
        with:
          name: bschat-${{ needs.resolve-tag.outputs.tag }}-${{ matrix.target_type }}-windows-x64
          path: |
            bin/

  publish-release:
    needs:
      - resolve-tag
      - build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: bschat-${{ needs.resolve-tag.outputs.tag }}-server-windows-x64
          path: dist/server

      - uses: actions/download-artifact@v8
        with:
          name: bschat-${{ needs.resolve-tag.outputs.tag }}-client-windows-x64
          path: dist/client

      - name: Attach shared release documents
        run: |
          cp CHANGELOG.md LICENSE README.md dist/server/
          cp CHANGELOG.md LICENSE README.md dist/client/

      # 产物名带 mc<线>：手动下载 zip 的用户不会看 tag，显式标注能避免装错 MC 版本。
      - name: Package server artifact
        working-directory: dist/server
        run: |
          zip -r "${GITHUB_WORKSPACE}/bschat-server-mc${{ needs.resolve-tag.outputs.mc_line }}-windows-x64.zip" .

      - name: Package client artifact
        working-directory: dist/client
        run: |
          zip -r "${GITHUB_WORKSPACE}/bschat-client-mc${{ needs.resolve-tag.outputs.mc_line }}-windows-x64.zip" .

      - id: extract-release-notes
        uses: ffurrer2/extract-release-notes@v3

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.resolve-tag.outputs.tag }}
          name: BSChat ${{ needs.resolve-tag.outputs.version }} (MC ${{ needs.resolve-tag.outputs.mc_line }})
          body: |
            ${{ steps.extract-release-notes.outputs.release_notes }}
          files: |
            bschat-server-mc${{ needs.resolve-tag.outputs.mc_line }}-windows-x64.zip
            bschat-client-mc${{ needs.resolve-tag.outputs.mc_line }}-windows-x64.zip
