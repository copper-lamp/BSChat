on:
  pull_request:
  push:
  workflow_dispatch:
  
jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        target_type:
          - server
          - client
    steps:
      - uses: actions/checkout@v7

      - uses: xmake-io/github-action-setup-xmake@v1
        # with:
        #   xmake-version: branch@master

      # 上游预编译包由其它工具链产出，和本机 clang-cl / MSVC 组合不一致时会留下
      # “已安装但缺少库文件”的损坏包（典型症状：libcurl 构建时 ninja 报 zlib.lib 缺失）。
      # 关闭预编译包，依赖统一从源码构建，保证包内文件与当前工具链一致。
      - run: |
          xmake global --policies=package.precompiled:n

      - name: Setup LLVM
        uses: ZhongRuoyu/setup-llvm@v0
        with:
          llvm-version: 22

      # 包构建中间目录按 run 隔离：不复用上次可能残留的半成品构建缓存。
      - run: |
          xmake repo -u
        env:
          XMAKE_PKG_CACHEDIR: ${{ runner.temp }}/xmake-package-cache-${{ github.run_id }}

      # 缓存键绑定包仓库 revision 与 xmake.lua，避免复用到依赖版本不匹配的旧包。
      - id: package-repositories
        shell: pwsh
        run: |
          $revisions = Get-ChildItem "$env:LOCALAPPDATA/.xmake/repositories" -Directory |
            Sort-Object Name |
            ForEach-Object {
              $revision = git -C $_.FullName rev-parse HEAD
              if ($LASTEXITCODE -ne 0) { throw "Unable to resolve $($_.Name) repository revision" }
              "$($_.Name)-$revision"
            }
          if (-not $revisions) { throw "No xmake package repositories were found" }
          "revisions=$($revisions -join '-')" >> $env:GITHUB_OUTPUT

      # 只缓存已安装的包目录。整个 .xmake 不能缓存：里面的 cache/packages 会带上失败构建的
      # 中间产物，恢复后 xmake 认为包已装好而跳过重建，构建随即在上述 zlib.lib 处失败。
      - uses: actions/cache@v6
        with:
          path: ~/AppData/Local/.xmake/packages
          key: xmake-packages-${{ runner.os }}-${{ matrix.target_type }}-${{ steps.package-repositories.outputs.revisions }}-${{ hashFiles('xmake.lua') }}
          restore-keys: |
            xmake-packages-${{ runner.os }}-${{ matrix.target_type }}-

      - run: |
          xmake f -a x64 -m release -p windows -v --target_type=${{ matrix.target_type }} -y
        env:
          XMAKE_PKG_CACHEDIR: ${{ runner.temp }}/xmake-package-cache-${{ github.run_id }}

      - run: |
          xmake -v -y
        env:
          XMAKE_PKG_CACHEDIR: ${{ runner.temp }}/xmake-package-cache-${{ github.run_id }}

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ github.event.repository.name }}-${{ github.sha }}-${{ matrix.target_type }}-windows-x64
          path: |
            bin/
